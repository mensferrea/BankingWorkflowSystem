name: Build and Test

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore BankingWorkflowSystem.slnx

    - name: Build Solution
      run: dotnet build BankingWorkflowSystem.slnx --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test BankingWorkflowSystem.slnx --no-build --configuration Release --verbosity normal
